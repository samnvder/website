<div class="pong-fun">
  <div class="pong-fun-row">
    <div class="pong-court-and-score">
      <div class="pong-court">
        <canvas class="pong-canvas" aria-label="Pickleball rally game"></canvas>
        <div class="carousel-label-play-wrap">
          <div class="carousel-label">
            <span class="carousel-label-line carousel-label-line--desktop">The Best Pickleball In</span>
            <span class="carousel-label-line carousel-label-line--mobile">The Best Pickleball</span>
            <span class="carousel-label-line carousel-label-line--desktop">The South Bay!</span>
            <span class="carousel-label-line carousel-label-line--mobile">In the South Bay</span>
          </div>
          <button class="pong-play-btn" type="button">Play Pong!</button>
        </div>
        <div class="pong-msg"></div>
        <div class="pong-game-end-cta">
          <button type="button" class="pong-play-again">Play Again?</button>
          <span class="pong-cta-sep">Or </span>
          <a href="https://southendclub.com/schedule-a-tour/">Book a Tour Here!</a>
        </div>
      </div>
      <div class="pong-score-row">
        <div class="pong-score-flex">
          <span class="pong-score-you">You: 0</span>
          <span class="pong-score-sep">–</span>
          <span class="pong-score-bot">The Bot: 0</span>
        </div>
        <div class="pong-rally-count">Rally Count 0</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var W = 1;
  var FIXED_DY = 1.35;
  function initPong(wrap) {
    var canvas = wrap.querySelector('.pong-canvas');
    var pill = wrap.querySelector('.carousel-label');
    var labelPlayWrap = wrap.querySelector('.carousel-label-play-wrap');
    var court = wrap.querySelector('.pong-court') || wrap;
    var playBtn = wrap.querySelector('.pong-play-btn');
    var scoreYou = wrap.querySelector('.pong-score-you');
    var scoreBot = wrap.querySelector('.pong-score-bot');
    var msgEl = wrap.querySelector('.pong-msg');
    var rallyEl = wrap.querySelector('.pong-rally-count');
    var gameEndCta = wrap.querySelector('.pong-game-end-cta');
    var playAgainBtn = gameEndCta ? gameEndCta.querySelector('.pong-play-again') : wrap.querySelector('.pong-play-again');
    if (!canvas || !pill) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var paddleH = 80, paddleW = 36, ballR = 8, baseSpeed = 4.5, speed = 4.5, speedMult = 1.10;
    var leftY = 0, rightY = 0, ballX = 0, ballY = 0, dx = 0, dy = 0;
    var courtH = 0, courtW = 0;
    var pillRect = { l: 0, r: 0, t: 0, b: 0 };
    var running = false, gameOver = false, playerScore = 0, botScore = 0, rallyCount = 0, msgT = null, rafId = null;
    function resize() {
      var r = court.getBoundingClientRect();
      courtW = r.width;
      courtH = r.height;
      canvas.width = courtW * dpr;
      canvas.height = courtH * dpr;
      canvas.style.width = courtW + 'px';
      canvas.style.height = courtH + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      if (pill.offsetParent !== null) {
        var pr = pill.getBoundingClientRect(), wr = court.getBoundingClientRect();
        pillRect.l = pr.left - wr.left;
        pillRect.r = pr.right - wr.left;
        pillRect.t = pr.top - wr.top;
        pillRect.b = pr.bottom - wr.top;
      }
      leftY = (courtH - paddleH) / 2;
      rightY = (courtH - paddleH) / 2;
      if (!running && !gameOver) {
        ballX = Math.min(pillRect.l > 10 ? pillRect.l - 50 : (courtW > 100 ? 80 : Math.max(24, courtW * 0.2)), 24 - ballR - 10);
        ballY = courtH / 2;
        dx = speed;
        dy = FIXED_DY;
      }
      speed = courtW <= 768 ? baseSpeed * 0.3 : baseSpeed;
      speedMult = courtW <= 768 ? 1.03 : 1.10;
    }
    function drawPaddle(x, y, left) {
      var w = paddleW, h = paddleH, r = 10;
      ctx.fillStyle = '#0b468c';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
      else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.strokeStyle = 'rgba(11,70,140,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#0b468c';
      ctx.font = 'bold 11px Montserrat,sans-serif';
      ctx.textAlign = 'center';
      var labelY, base = 'top';
      if (y + h + 20 > courtH) { base = 'bottom'; labelY = y - 14; }
      else { labelY = y + h + 10; }
      ctx.textBaseline = base;
      ctx.fillText(left ? 'You' : 'The Bot', x + w / 2, labelY);
    }
    function drawBall() {
      ctx.fillStyle = '#f4c430';
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.stroke();
      [[0.3, 0], [-0.25, 0.4], [-0.25, -0.4], [0.5, 0.5], [0.5, -0.5]].forEach(function(h) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.arc(ballX + h[0] * ballR, ballY + h[1] * ballR, ballR * 0.2, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function upScore() {
      if (scoreYou) scoreYou.textContent = 'You: ' + playerScore;
      if (scoreBot) scoreBot.textContent = 'The Bot: ' + botScore;
    }
    function upRally() {
      rallyCount++;
      if (rallyEl) rallyEl.textContent = 'Rally Count ' + rallyCount;
    }
    function showMsg(txt, win) {
      if (msgEl) {
        msgEl.textContent = txt;
        msgEl.className = 'pong-msg ' + (win ? 'win' : 'lose');
        msgEl.style.display = 'block';
        clearTimeout(msgT);
        msgT = setTimeout(function() { msgEl.style.display = 'none'; }, 2500);
      }
    }
    function endGame(won) {
      running = false;
      gameOver = true;
      if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
      canvas.style.pointerEvents = 'none';
      showMsg(won ? 'You Win!' : 'You Lose!', won);
      if (rallyEl) rallyEl.classList.remove('visible');
      if (gameEndCta) gameEndCta.style.display = 'flex';
      ballX = Math.min(pillRect.l > 10 ? pillRect.l - 50 : (courtW > 100 ? 80 : Math.max(24, courtW * 0.2)), 24 - ballR - 10);
      ballY = courtH / 2;
      drawIdle();
    }
    function drawIdle() {
      ctx.clearRect(0, 0, courtW, courtH);
      drawPaddle(24, leftY, true);
      drawPaddle(courtW - 24 - paddleW, rightY, false);
      drawBall();
    }
    function loop() {
      if (!running || gameOver) return;
      ctx.clearRect(0, 0, courtW, courtH);
      ballX += dx;
      ballY += dy;
      var lx = 24, rx = courtW - 24 - paddleW;
      if (ballX - ballR <= lx + paddleW && ballX + ballR >= lx && ballY >= leftY && ballY <= leftY + paddleH) {
        dx = Math.abs(dx);
        dx *= speedMult;
        dy *= speedMult;
        upRally();
      }
      if (ballX + ballR >= rx && ballX - ballR <= rx + paddleW && ballY >= rightY && ballY <= rightY + paddleH) {
        dx = -Math.abs(dx);
        dx *= speedMult;
        dy *= speedMult;
        upRally();
      }
      if (ballY <= ballR || ballY >= courtH - ballR) dy = -dy;
      if (ballX < -ballR * 3) {
        botScore++;
        upScore();
        if (botScore >= W) { endGame(false); return; }
        ballX = pillRect.r > 10 ? pillRect.r + 40 : (courtW > 100 ? courtW - 80 : Math.min(courtW - 24, courtW * 0.8));
        dx = -speed;
        dy = FIXED_DY;
      }
      if (ballX > courtW + ballR * 3) {
        playerScore++;
        upScore();
        if (playerScore >= W) { endGame(true); return; }
        ballX = Math.min(pillRect.l > 10 ? pillRect.l - 50 : (courtW > 100 ? 80 : Math.max(24, courtW * 0.2)), 24 - ballR - 10);
        dx = speed;
        dy = FIXED_DY;
      }
      rightY += (ballY - (rightY + paddleH / 2)) * 0.15;
      rightY = Math.max(0, Math.min(courtH - paddleH, rightY));
      drawPaddle(lx, leftY, true);
      drawPaddle(rx, rightY, false);
      drawBall();
      rafId = requestAnimationFrame(loop);
    }
    function start() {
      if (running) return;
      gameOver = false;
      running = true;
      rallyCount = 0;
      if (rallyEl) { rallyEl.textContent = 'Rally Count 0'; rallyEl.classList.add('visible'); }
      if (labelPlayWrap) labelPlayWrap.style.display = 'none';
      else { if (pill) pill.style.display = 'none'; if (playBtn) playBtn.style.display = 'none'; }
      if (gameEndCta) gameEndCta.style.display = 'none';
      if (msgEl) msgEl.style.display = 'none';
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          resize();
          ballX = Math.min(pillRect.l > 10 ? pillRect.l - 50 : (courtW > 100 ? 80 : Math.max(24, courtW * 0.2)), 24 - ballR - 10);
          ballY = courtH / 2;
          dx = speed;
          dy = FIXED_DY;
          loop();
        });
      });
    }
    function reset() {
      rallyCount = 0;
      upScore();
      gameOver = false;
      canvas.style.pointerEvents = '';
      if (pill) pill.style.display = '';
      if (rallyEl) rallyEl.classList.remove('visible');
      if (gameEndCta) gameEndCta.style.display = 'none';
      if (labelPlayWrap) labelPlayWrap.style.display = '';
      else if (playBtn) playBtn.style.display = 'inline-flex';
      if (pill && !labelPlayWrap) pill.style.display = '';
      leftY = (courtH - paddleH) / 2;
      rightY = (courtH - paddleH) / 2;
      ballX = Math.min(pillRect.l > 10 ? pillRect.l - 50 : (courtW > 100 ? 80 : Math.max(24, courtW * 0.2)), 24 - ballR - 10);
      ballY = courtH / 2;
      dx = speed;
      dy = FIXED_DY;
      drawIdle();
    }
    function move(cy) {
      var r = court.getBoundingClientRect();
      var y = cy - r.top;
      leftY = Math.max(0, Math.min(courtH - paddleH, y - paddleH / 2));
    }
    if (playBtn) playBtn.onclick = function() { reset(); start(); };
    if (playAgainBtn) playAgainBtn.onclick = function(e) { e.preventDefault(); reset(); start(); };
    canvas.onmousedown = function(e) { if (e.offsetX < courtW / 2 && running) move(e.clientY); };
    canvas.onmousemove = function(e) { if (e.buttons && e.offsetX < courtW / 2 && running) move(e.clientY); };
    canvas.ontouchstart = function(e) {
      if (running) {
        if (e.touches[0].clientX < court.getBoundingClientRect().left + courtW / 2) { e.preventDefault(); move(e.touches[0].clientY); }
      } else if (!gameOver) { e.preventDefault(); reset(); start(); }
    };
    canvas.ontouchmove = function(e) {
      if (e.touches[0].clientX < court.getBoundingClientRect().left + courtW / 2 && running) { e.preventDefault(); move(e.touches[0].clientY); }
    };
    resize();
    window.addEventListener('resize', resize);
    upScore();
    setTimeout(function() { if (!running && canvas.width) drawIdle(); }, 100);
  }
  document.querySelectorAll('.pong-fun').forEach(initPong);
})();
</script>
