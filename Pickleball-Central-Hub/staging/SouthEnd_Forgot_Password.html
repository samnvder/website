<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/openplay-testing-env.js?se_cb=2026-04-27T00%3A23%3A31.235Z"></script>
<title>Reset password | South End Pickleball</title>
<meta name="description" content="Reset your South End Open Play account password.">
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy-lt:#152342;--electric:#a855f7;--neon:#00ff88;--ink:#0a0a1a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:radial-gradient(1000px 520px at 10% -10%,rgba(168,85,247,.12),transparent),var(--navy);color:#fff;min-height:100vh;}
.header{background:var(--navy-lt);padding:18px 28px 14px;border-bottom:3px solid var(--neon);}
.hdr-eyebrow{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--neon);margin-bottom:3px;}
.hdr-title{font-family:'Oswald',sans-serif;font-size:24px;color:#fff;letter-spacing:1px;text-transform:uppercase;line-height:1;}
.hdr-title span{color:var(--neon);}
.hdr-sub{font-size:9px;color:rgba(255,255,255,.65);margin-top:3px;}
.se-site-nav{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 28px 12px;background:rgba(5,12,28,.85);border-bottom:1px solid rgba(0,255,136,.22);}
.se-site-nav-link{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);text-decoration:none;padding:8px 14px;border-radius:6px;border:1px solid transparent;}
.se-site-nav-link:hover{color:var(--neon);background:rgba(0,255,136,.08);}
.body-wrap{max-width:480px;margin:0 auto;padding:34px 20px 56px;}
.panel{background:rgba(0,255,136,.06);border:1.5px solid rgba(0,255,136,.22);border-radius:12px;padding:22px 22px 24px;box-shadow:0 18px 60px rgba(0,0,0,.26);}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--neon);margin-bottom:8px;}
h1{font-family:'Oswald',sans-serif;font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.lead{font-size:13px;color:rgba(255,255,255,.72);line-height:1.55;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:6px;font-family:'Barlow',sans-serif;font-size:14px;color:#fff;outline:none;}
.field input:focus{border-color:var(--neon);}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.btn{flex:1;min-width:150px;padding:11px 14px;border:none;border-radius:6px;font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none;}
.btn-primary{background:var(--neon);color:var(--ink);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-primary[disabled]{opacity:.62;cursor:wait;}
.btn-secondary{background:rgba(255,255,255,.1);color:rgba(255,255,255,.86);}
.btn-secondary:hover{background:rgba(255,255,255,.16);}
.msg{margin-top:14px;font-size:12px;line-height:1.55;min-height:1.2em;}
.msg.err{color:#ff8888;}
.msg.ok{color:var(--neon);}
.toast{position:fixed;right:18px;bottom:18px;z-index:20;width:min(420px,calc(100% - 36px));padding:14px 16px;border-radius:10px;border:1.5px solid rgba(0,255,136,.4);background:#10233c;color:#fff;box-shadow:0 14px 46px rgba(0,0,0,.45);font-size:13px;line-height:1.45;transform:translateY(140%);opacity:0;transition:opacity .18s,transform .18s;}
.toast.show{opacity:1;transform:translateY(0);}
.toast strong{color:var(--neon);}
@media(max-width:520px){.actions{flex-direction:column}.btn{width:100%}.header{padding-left:18px;padding-right:18px}.body-wrap{padding-top:24px}}
</style>
</head>
<body>
<div class="header">
  <div class="hdr-eyebrow">South End Racquet &amp; Health Club</div>
  <div class="hdr-title">RESET <span>PASSWORD</span></div>
  <div class="hdr-sub">Open Play account recovery.</div>
</div>
<nav class="se-site-nav" aria-label="Pickleball hub sections" data-se-hub-nav></nav>
<script src="/pickleball-hub-nav.js?v=20260427-admin-hub"></script>

<main class="body-wrap">
  <section class="panel">
    <div class="eyebrow">Forgot password</div>
    <h1>Send a reset link</h1>
    <p class="lead">Enter the email address on your South End Open Play account. If that email has an account, we will send a secure password reset link.</p>
    <div class="field">
      <label for="reset-email">Email</label>
      <input type="email" id="reset-email" autocomplete="email" inputmode="email" placeholder="you@email.com">
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="reset-send">Send reset link</button>
      <a class="btn btn-secondary" id="back-to-account" href="/open-play/account">Back to sign in</a>
    </div>
    <div class="msg" id="reset-msg" role="status" aria-live="polite"></div>
  </section>
</main>

<div class="toast" id="reset-toast" role="status" aria-live="polite"></div>
<script src="/js/openplay-firebase-config.js?se_cb=2026-04-27T00%3A23%3A31.235Z"></script>
<script src="/js/south-end-openplay-sync.js?v=20260427-forgot-password&se_cb=2026-04-27T00%3A23%3A31.235Z"></script>
<script>
function qs(name) {
  try { return new URLSearchParams(window.location.search || '').get(name) || ''; } catch (e) { return ''; }
}
function accountHref() {
  var path = String(window.location && window.location.pathname ? window.location.pathname : '').replace(/\\/g, '/');
  if (path.indexOf('/Programs/') !== -1 || path.indexOf('/advanced-open-play/staging/') !== -1 || path.indexOf('/advanced-open-play/live/') !== -1) {
    return 'SouthEnd_OpenPlay_Account.html';
  }
  return '/open-play/account';
}
function showMsg(text, kind) {
  var el = document.getElementById('reset-msg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}
function showToast(html) {
  var el = document.getElementById('reset-toast');
  if (!el) return;
  el.innerHTML = html || '';
  el.classList.add('show');
}
function validEmail(email) {
  return /^[^@]+@[^@]+\.[^@]+$/.test(email);
}
function initForgotPassword() {
  var back = document.getElementById('back-to-account');
  var input = document.getElementById('reset-email');
  var send = document.getElementById('reset-send');
  if (back) back.setAttribute('href', accountHref());
  if (input) {
    input.value = (qs('email') || '').trim();
    setTimeout(function () { input.focus(); if (!input.value) return; input.select(); }, 30);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        send.click();
      }
    });
  }
  if (!window.SEOpenPlay || !SEOpenPlay.firebaseConfigured || !SEOpenPlay.firebaseConfigured()) {
    showMsg('Sign-in service is not configured. Please try again later.', 'err');
    if (send) send.disabled = true;
    return;
  }
  send.addEventListener('click', function () {
    var email = (input.value || '').trim();
    if (!validEmail(email)) {
      showMsg('Enter a valid email address.', 'err');
      return;
    }
    send.disabled = true;
    var original = send.textContent;
    send.textContent = 'Checking...';
    showMsg('Checking for an account...', 'ok');
    SEOpenPlay.accountEmailExists(email)
      .then(function (exists) {
        if (!exists) {
          showMsg('No account found for that email. Try the email you registered with, or create a new account.', 'err');
          send.disabled = false;
          send.textContent = original;
          return null;
        }
        send.textContent = 'Sending...';
        showMsg('Account found. Sending reset link...', 'ok');
        return SEOpenPlay.sendPasswordReset(email).then(function () {
          var success = 'Password reset link sent to ' + email + '. Check your primary inbox, and if you do not see it, check your spam or junk folder.';
          showMsg(success, 'ok');
          showToast('<strong>Reset email sent.</strong><br>Check your primary inbox. If you do not see it, check spam or junk too.');
          send.textContent = 'Sent';
        });
      })
      .catch(function (err) {
        var code = err && err.code ? String(err.code) : '';
        var msg = (err && err.message) || 'Could not send reset email.';
        if (code === 'auth/invalid-email') msg = 'That email address looks invalid. Double-check it and try again.';
        if (code === 'auth/too-many-requests') msg = 'Too many attempts. Wait a few minutes before trying again.';
        if (code === 'auth/network-request-failed') msg = 'Network error. Check your connection and try again.';
        showMsg(msg, 'err');
        send.disabled = false;
        send.textContent = original;
      });
  });
}
document.addEventListener('DOMContentLoaded', initForgotPassword);
</script>
</body>
</html>
