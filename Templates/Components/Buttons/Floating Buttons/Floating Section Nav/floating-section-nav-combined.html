<!-- =========================================================
     SOUTH END CLUB — REUSABLE COMPONENT (ALL-IN-ONE)
     Floating Section Nav  (Desktop dots + Mobile accordion)
     =========================================================

     This file contains the HTML, CSS, and JS in a single file.
     Drop this into any page and it's fully self-contained.

     CUSTOMISATION
     ─────────────────────────────────────────────────────────
     • Add / remove links.  Keep data-section="<id>" matching
       the <section id="..."> on the page.
     • data-nav-hero on the desktop nav: selector for the hero
       section used to show/hide the nav (default ".hero").
     • data-section-names on the desktop nav: JSON map of
       section-id → display name for the mobile toggle label.
       Example:
         data-section-names='{"banquet-hall":"Banquet Hall","garden-gazebo":"Gazebo"}'
     ========================================================= -->


<!-- ===========================
     CSS
     =========================== -->
<style>
/* =========================================================
   A) DESKTOP FLOATING NAV  (right-side dot rail)
      Visible > 1024 px
========================================================= */

.sec-floating-nav {
  position: fixed;
  right: 30px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.sec-floating-nav.visible {
  opacity: 1;
  visibility: visible;
}

.sec-floating-nav.faded {
  opacity: 0.15;
  transition: opacity 0.4s ease;
}

/* Inner pill container */
.sec-nav-inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px 14px;
  background: var(--bg-card, rgba(255, 255, 255, 0.95));
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 2px solid rgba(11, 70, 140, 0.15);
  border-radius: var(--radius-lg, 40px);
  box-shadow:
    var(--shadow-strong, 0 20px 60px rgba(11, 70, 140, 0.25)),
    0 0 30px rgba(11, 70, 140, 0.1);
}

/* Individual link */
.sec-nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  text-decoration: none;
  color: var(--text-secondary, #3d5a5e);
  font-size: 0.85rem;
  font-weight: 600;
  border-radius: var(--radius-sm, 16px);
  transition: background 0.3s ease, color 0.3s ease;
  position: relative;
}

.sec-nav-link::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-sm, 16px);
  background: linear-gradient(135deg,
    var(--accent-blue, #0b468c),
    var(--accent-teal, #204147));
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* Dot */
.sec-nav-link .nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(11, 70, 140, 0.3);
  transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  box-shadow: 0 0 8px rgba(11, 70, 140, 0.2);
}

/* Label text (hidden until hover/active) */
.sec-nav-link span:not(.nav-dot) {
  opacity: 0;
  transform: translateX(-10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}

/* Hover */
.sec-nav-link:hover,
.sec-nav-link:active {
  background: rgba(11, 70, 140, 0.1);
}
.sec-nav-link:hover::before { opacity: 0.08; }
.sec-nav-link:hover span:not(.nav-dot),
.sec-nav-link.active span:not(.nav-dot) {
  opacity: 1;
  transform: translateX(0);
}

/* Active */
.sec-nav-link.active {
  color: var(--accent-blue, #0b468c);
  background: rgba(11, 70, 140, 0.12);
}
.sec-nav-link.active::before { opacity: 0.12; }
.sec-nav-link.active .nav-dot {
  background: var(--accent-blue, #0b468c);
  box-shadow:
    0 0 20px rgba(11, 70, 140, 0.6),
    0 0 40px rgba(11, 70, 140, 0.3);
  transform: scale(1.2);
}

/* Hide desktop nav on tablet/mobile */
@media (max-width: 1024px) {
  .sec-floating-nav { display: none; }
}

/* Laptop / small-desktop viewport fixes */
@media (min-width: 1025px) and (max-height: 900px) {
  .sec-floating-nav {
    top: 200px !important;
    transform: translateY(0) !important;
  }
}
@media (min-width: 1025px) and (max-height: 750px) {
  .sec-floating-nav {
    top: 180px !important;
    transform: translateY(0) !important;
  }
}


/* =========================================================
   B) MOBILE FLOATING NAV  (accordion, top-right)
      Visible ≤ 1024 px
========================================================= */

.sec-mobile-nav {
  display: none;
  position: fixed;
  right: 12px;
  top: 80px;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

@media (max-width: 1024px) {
  .sec-mobile-nav.visible {
    display: block;
    opacity: 1;
    visibility: visible;
  }
}

.sec-mobile-nav.faded {
  opacity: 0.15;
  transition: opacity 0.4s ease;
}

/* Accordion container */
.sec-mobile-nav-inner {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
  background: var(--bg-card, rgba(255, 255, 255, 0.95));
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 2px solid rgba(11, 70, 140, 0.15);
  border-radius: var(--radius-lg, 40px);
  box-shadow:
    var(--shadow-strong, 0 20px 60px rgba(11, 70, 140, 0.25)),
    0 0 30px rgba(11, 70, 140, 0.1);
  overflow: hidden;
  max-height: 56px;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.sec-mobile-nav-inner.expanded {
  max-height: 420px;
}

/* Toggle button */
.sec-mobile-nav-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 20px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--accent-blue, #0b468c);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  transition: background 0.3s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.sec-mobile-nav-toggle:hover {
  background: rgba(11, 70, 140, 0.08);
}

.sec-mobile-nav-toggle .toggle-icon {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
}

.sec-mobile-nav-inner.expanded .sec-mobile-nav-toggle .toggle-icon {
  transform: rotate(180deg);
}

/* Link list */
.sec-mobile-nav-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px 14px;
  border-top: 2px solid rgba(11, 70, 140, 0.1);
}

.sec-mobile-nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  text-decoration: none;
  color: var(--text-secondary, #3d5a5e);
  font-size: 0.85rem;
  font-weight: 600;
  border-radius: var(--radius-sm, 16px);
  transition: background 0.3s ease, color 0.3s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.sec-mobile-nav-link .nav-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(11, 70, 140, 0.3);
  transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
  flex-shrink: 0;
  box-shadow: 0 0 6px rgba(11, 70, 140, 0.2);
}

.sec-mobile-nav-link span:not(.nav-dot) {
  opacity: 1;
  transform: translateX(0);
  white-space: nowrap;
}

.sec-mobile-nav-link:hover,
.sec-mobile-nav-link:active {
  background: rgba(11, 70, 140, 0.1);
}

.sec-mobile-nav-link.active {
  color: var(--accent-blue, #0b468c);
  background: rgba(11, 70, 140, 0.12);
}

.sec-mobile-nav-link.active .nav-dot {
  background: var(--accent-blue, #0b468c);
  box-shadow:
    0 0 16px rgba(11, 70, 140, 0.6),
    0 0 30px rgba(11, 70, 140, 0.3);
  transform: scale(1.3);
}


/* =========================================================
   MOBILE PERFORMANCE
========================================================= */

@media (max-width: 768px) {
  .sec-floating-nav,
  .sec-mobile-nav {
    will-change: opacity, transform;
    transform: translate3d(0, 0, 0);
  }
}
</style>


<!-- ===========================
     DESKTOP NAV (right-side dots)
     =========================== -->
<nav class="sec-floating-nav" id="secFloatingNav"
     data-nav-hero=".hero"
     data-section-names='{}'>
  <div class="sec-nav-inner">

    <!-- ▼ EDIT LINKS HERE ▼ -->
    <a href="#section-1" class="sec-nav-link active" data-section="section-1">
      <span class="nav-dot"></span>
      <span>Section 1</span>
    </a>
    <a href="#section-2" class="sec-nav-link" data-section="section-2">
      <span class="nav-dot"></span>
      <span>Section 2</span>
    </a>
    <a href="#section-3" class="sec-nav-link" data-section="section-3">
      <span class="nav-dot"></span>
      <span>Section 3</span>
    </a>
    <a href="#section-4" class="sec-nav-link" data-section="section-4">
      <span class="nav-dot"></span>
      <span>Section 4</span>
    </a>
    <a href="#section-5" class="sec-nav-link" data-section="section-5">
      <span class="nav-dot"></span>
      <span>Inquire</span>
    </a>
    <!-- ▲ END LINKS ▲ -->

  </div>
</nav>


<!-- ===========================
     MOBILE NAV (accordion)
     =========================== -->
<nav class="sec-mobile-nav" id="secMobileNav">
  <div class="sec-mobile-nav-inner" id="secMobileNavInner">

    <button class="sec-mobile-nav-toggle" id="secMobileNavToggle">
      <span class="current-section">Section 1</span>
      <svg class="toggle-icon" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <div class="sec-mobile-nav-links">

      <!-- ▼ EDIT LINKS HERE (mirror desktop links) ▼ -->
      <a href="#section-1" class="sec-mobile-nav-link active" data-section="section-1">
        <span class="nav-dot"></span>
        <span>Section 1</span>
      </a>
      <a href="#section-2" class="sec-mobile-nav-link" data-section="section-2">
        <span class="nav-dot"></span>
        <span>Section 2</span>
      </a>
      <a href="#section-3" class="sec-mobile-nav-link" data-section="section-3">
        <span class="nav-dot"></span>
        <span>Section 3</span>
      </a>
      <a href="#section-4" class="sec-mobile-nav-link" data-section="section-4">
        <span class="nav-dot"></span>
        <span>Section 4</span>
      </a>
      <a href="#section-5" class="sec-mobile-nav-link" data-section="section-5">
        <span class="nav-dot"></span>
        <span>Inquire</span>
      </a>
      <!-- ▲ END LINKS ▲ -->

    </div>
  </div>
</nav>


<!-- ===========================
     JAVASCRIPT
     =========================== -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ── DOM refs ────────────────────────────────── */
  var floatingNav     = document.getElementById('secFloatingNav');
  var mobileNav       = document.getElementById('secMobileNav');
  var mobileNavInner  = document.getElementById('secMobileNavInner');
  var mobileNavToggle = document.getElementById('secMobileNavToggle');
  if (!floatingNav && !mobileNav) return;

  var currentSectionText = mobileNavToggle
    ? mobileNavToggle.querySelector('.current-section')
    : null;

  /* ── Config from data-* ─────────────────────── */
  var heroSelector = (floatingNav && floatingNav.getAttribute('data-nav-hero'))
    || '.hero';
  var hero = document.querySelector(heroSelector);

  var sectionNames = {};
  try {
    sectionNames = JSON.parse(
      (floatingNav && floatingNav.getAttribute('data-section-names')) || '{}'
    );
  } catch (e) { /* ignore bad JSON */ }

  /* Build fallback names from link text if not provided */
  var allLinks = document.querySelectorAll('.sec-nav-link, .sec-mobile-nav-link');
  allLinks.forEach(function (link) {
    var id = link.getAttribute('data-section');
    if (id && !sectionNames[id]) {
      var textSpan = link.querySelector('span:not(.nav-dot)');
      if (textSpan) sectionNames[id] = textSpan.textContent.trim();
    }
  });

  var sections = document.querySelectorAll('.section[id]');
  var navLinks = document.querySelectorAll('.sec-nav-link, .sec-mobile-nav-link');

  /* ── Responsive check ───────────────────────── */
  var isMobile = window.innerWidth <= 1024;
  window.addEventListener('resize', function () {
    isMobile = window.innerWidth <= 1024;
  });

  /* ── Fade timers ────────────────────────────── */
  var mobileIdleTimer  = null;
  var desktopIdleTimer = null;

  // Mobile
  function showMobileNav() {
    if (mobileNav && mobileNav.classList.contains('visible')) {
      mobileNav.classList.remove('faded');
    }
  }
  function startMobileFadeTimer() {
    if (!isMobile) return;
    clearTimeout(mobileIdleTimer);
    showMobileNav();
    mobileIdleTimer = setTimeout(function () {
      if (mobileNav && mobileNav.classList.contains('visible')
          && mobileNavInner && !mobileNavInner.classList.contains('expanded')) {
        mobileNav.classList.add('faded');
      }
    }, 1000);
  }

  // Desktop
  function showDesktopNav() {
    if (floatingNav && floatingNav.classList.contains('visible')) {
      floatingNav.classList.remove('faded');
    }
  }
  function startDesktopFadeTimer() {
    if (isMobile) return;
    clearTimeout(desktopIdleTimer);
    showDesktopNav();
    desktopIdleTimer = setTimeout(function () {
      if (floatingNav && floatingNav.classList.contains('visible')) {
        floatingNav.classList.add('faded');
      }
    }, 750);
  }

  /* ── Mobile accordion toggle ────────────────── */
  if (mobileNavToggle) {
    mobileNavToggle.addEventListener('click', function () {
      mobileNavInner.classList.toggle('expanded');
      if (mobileNavInner.classList.contains('expanded')) {
        mobileNav.classList.remove('faded');
        clearTimeout(mobileIdleTimer);
      } else {
        startMobileFadeTimer();
      }
    });
  }

  // Close accordion when clicking outside
  document.addEventListener('click', function (e) {
    if (mobileNavInner && mobileNav && !mobileNav.contains(e.target)) {
      mobileNavInner.classList.remove('expanded');
    }
  });

  /* ── Show / Hide via hero IntersectionObserver ── */
  if (hero) {
    var heroObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          if (floatingNav) floatingNav.classList.remove('visible', 'faded');
          if (mobileNav)   mobileNav.classList.remove('visible', 'faded');
          if (mobileNavInner) mobileNavInner.classList.remove('expanded');
          clearTimeout(mobileIdleTimer);
          clearTimeout(desktopIdleTimer);
        } else {
          if (floatingNav) floatingNav.classList.add('visible');
          if (mobileNav)   mobileNav.classList.add('visible');
          startMobileFadeTimer();
          startDesktopFadeTimer();
        }
      });
    }, { threshold: 0.5 });

    heroObserver.observe(hero);
  } else {
    // No hero → show immediately after short delay
    setTimeout(function () {
      if (floatingNav) floatingNav.classList.add('visible');
      if (mobileNav)   mobileNav.classList.add('visible');
      startMobileFadeTimer();
      startDesktopFadeTimer();
    }, 500);
  }

  /* ── Scroll / touch wake ────────────────────── */
  window.addEventListener('scroll', function () {
    if (isMobile) startMobileFadeTimer();
    else          startDesktopFadeTimer();
  }, { passive: true });

  if (isMobile) {
    window.addEventListener('touchstart', startMobileFadeTimer, { passive: true });
    window.addEventListener('touchmove',  startMobileFadeTimer, { passive: true });
  }

  /* ── Desktop: hover wakes nav ───────────────── */
  if (floatingNav) {
    floatingNav.addEventListener('mouseenter', function () {
      clearTimeout(desktopIdleTimer);
      showDesktopNav();
    }, { passive: true });
    floatingNav.addEventListener('mouseleave', function () {
      startDesktopFadeTimer();
    }, { passive: true });
  }

  /* ── Active section tracking ────────────────── */
  var currentSection = '';

  function updateActiveSection() {
    var maxVisibility    = 0;
    var mostVisibleId    = '';

    sections.forEach(function (section) {
      var rect         = section.getBoundingClientRect();
      var windowHeight = window.innerHeight;
      var visibleTop   = Math.max(0, rect.top);
      var visibleBottom = Math.min(windowHeight, rect.bottom);
      var visibleHeight = Math.max(0, visibleBottom - visibleTop);
      var centerOffset  = Math.abs((rect.top + rect.bottom) / 2 - windowHeight / 2);
      var visibility    = visibleHeight - centerOffset * 0.3;

      if (visibility > maxVisibility && rect.top < windowHeight * 0.6) {
        maxVisibility = visibility;
        mostVisibleId = section.id;
      }
    });

    if (mostVisibleId && mostVisibleId !== currentSection) {
      currentSection = mostVisibleId;
      navLinks.forEach(function (link) {
        var isActive = link.getAttribute('data-section') === currentSection;
        link.classList.toggle('active', isActive);
      });
      if (currentSectionText && sectionNames[currentSection]) {
        currentSectionText.textContent = sectionNames[currentSection];
      }
    }
  }

  // Throttled via rAF
  var scrollRAF = null;
  function throttledUpdate() {
    if (!scrollRAF) {
      scrollRAF = requestAnimationFrame(function () {
        updateActiveSection();
        scrollRAF = null;
      });
    }
  }

  window.addEventListener('scroll', throttledUpdate, { passive: true });
  updateActiveSection();

  /* ── Smooth scroll on link click ────────────── */
  document.querySelectorAll('.sec-nav-link, .sec-mobile-nav-link').forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        requestAnimationFrame(function () {
          target.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
        });
        // Close mobile accordion
        if (mobileNavInner) {
          mobileNavInner.classList.remove('expanded');
        }
      }
    }, { passive: false });
  });
});
</script>
