<div id="membershipBuilder" class="membership-builder container">
    <h1 id="pageTitle">Build Your Membership</h1>
    
    <!-- Membership Type Selection -->
    <div class="input-wrapper">
        <label for="membershipType">Membership Type:</label>
        <select id="membershipType" class="styled-select">
            <option value="single">Single</option>
            <option value="couple">Couple</option>
            <option value="family">Family</option>
        </select>
    </div>
    
    <!-- Number of Children Selection (for Family only) -->
    <div id="familyOptions" style="display:none;">
        <div class="input-wrapper">
            <label for="numberOfChildren">Number of Children:</label>
            <select id="numberOfChildren" class="styled-select">
                <option value="1">1</option>
                <option value="2" selected="">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>
        <!-- Children's Ages (appear dynamically based on the number of children) -->
        <div id="childrenAgesContainer" class="age-inputs-container"></div>
    </div>
    
    <!-- Tier Selection -->
    <div class="input-wrapper">
        <label for="tier">Tier:</label>
        <select id="tier" class="styled-select">
            <option value="3">Tier 3 - Health &amp; Fitness</option>
            <option value="2">Tier 2 - Racquet</option>
            <option value="1">Tier 1 - Full Club</option>
        </select>
    </div>
    
    <!-- Pricing Info -->
    <div class="content-box">
        <p class="enrollment-fee-info">
            <span>One-Time Enrollment Fee:</span>
            <span id="originalPrice" class="strikethrough">$0</span>
        </p>
        <p class="enrollment-fee-info">
            <span id="discountedPrice">$0</span>
            <span id="limitedTimeText" class="limited-time">for a limited time</span>
        </p>
        <p id="priceDisplay" class="price-info bold-text">Monthly Due: $0</p>
        <p id="minimumAmount" class="price-info">Monthly Food &amp; Beverage Assessment: $20</p>
        <p id="commitmentMessage">
            All memberships are a one-year commitment where once the initial year ends, you are month to month thereafter.
        </p>
    </div>
    
    <!-- Personal Info Section for Name, Email, and Phone -->
    <div class="personal-info">
        <div class="input-wrapper">
            <label for="name">Full Name:</label>
            <input type="text" id="name" class="styled-input personal-input" placeholder="Enter your full name" required="">
        </div>
        
        <div class="input-wrapper">
            <label for="email">Email Address:</label>
            <input type="email" id="email" class="styled-input personal-input" placeholder="Enter your email" required="">
        </div>
        
        <div class="input-wrapper">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" class="styled-input personal-input" placeholder="Enter your phone number" required="">
        </div>
    </div>
    
    <!-- Hidden Input Fields to Capture Dynamic Values -->
    <input type="hidden" id="enrollmentFee" name="enrollmentFee" value="300">
    <input type="hidden" id="monthlyDue" name="monthlyDue" value="170">
    <input type="hidden" id="foodBeverageMinimum" name="foodBeverageMinimum" value="20">
    
    <!-- Buy Membership Button -->
    <button type="button" id="purchaseButton" class="membership-btn">Buy Membership</button>
</div>

<script>
// NUMBER-ONLY VALIDATION FOR AGE FIELDS
function enforceNumbersOnly(inputElement) {
    inputElement.addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
    
    inputElement.addEventListener('keypress', function(e) {
        if (e.which < 48 || e.which > 57) {
            e.preventDefault();
        }
    });
    
    inputElement.addEventListener('paste', function(e) {
        e.preventDefault();
        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        const numericOnly = pastedText.replace(/[^0-9]/g, '');
        this.value = numericOnly;
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) {
                    const inputs = node.querySelectorAll('input[type="text"].styled-input, input[type="number"].styled-input');
                    inputs.forEach(function(input) {
                        if (input.closest('#childrenAgesContainer')) {
                            enforceNumbersOnly(input);
                        }
                    });
                }
            });
        });
    });
    
    const container = document.getElementById('childrenAgesContainer');
    if (container) {
        observer.observe(container, {
            childList: true,
            subtree: true
        });
    }
});
</script>
