        // Detect if Thrive Architect Editor is active
        const isThriveEditor = document.body.classList.contains('thrive-admin');

        // Only inject modal HTML if not in Thrive Editor

            // Ensure the modal is hidden by default
            const modal = document.getElementById('zapierFormModal');
            if (modal) modal.style.display = 'none';
        }

        // Toggle modal visibility and button color
        function toggleMessageForm() {
            const modal = document.getElementById('zapierFormModal');
            const button = document.getElementById('messageUsButton');
            if (modal.style.display === 'flex') {
                closeMessageForm(); // Close the modal
                button.classList.remove('open'); // Remove open class from button
            } else {
                openMessageForm(); // Open the modal
                button.classList.add('open'); // Add open class to button
            }
        }

        // Open the modal
        function openMessageForm() {
            const modal = document.getElementById('zapierFormModal');
            if (modal) modal.style.display = 'flex';
        }

        // Close the modal
        function closeMessageForm() {
            const modal = document.getElementById('zapierFormModal');
            const button = document.getElementById('messageUsButton');
            if (modal) modal.style.display = 'none';
            button.classList.remove('open'); // Ensure button reverts back to default
        }
