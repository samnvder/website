	<div class="tve-page-section-in tve_empty_dropzone" data-css="tve-u-675107c2039024"><div class="thrv_wrapper thrv_custom_html_shortcode" data-css="tve-u-193949ab0a0" style="margin-top: 152px !important;"><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Reviews</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        #business-overview {
            text-align: center;
            margin-bottom: 20px;
        }

        .rating-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .stars {
            color: #FFD700; /* Gold stars */
            font-size: 24px;
            margin-right: 10px;
        }

        .review-count {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .review-count img {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }

        #google-reviews {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        .review {
            margin-bottom: 20px;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .review-header {
            display: flex;
            align-items: center;
        }

        .review-profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .review-rating {
            color: #FFD700; /* Gold stars */
            margin: 5px 0;
        }

        .review-text {
            font-size: 14px;
            color: #333;
            margin: 5px 0;
        }

        .review-date {
            font-size: 12px;
            color: #888;
        }

        a {
            text-decoration: none;
            color: inherit; /* Keep the original color */
        }
    </style>


    <h1>Testimonials</h1>
    <div id="business-overview">
        <div class="rating-container">
            <a href="https://www.google.com/maps/place/?q=place_id:ChIJe0ftVvdK3YARL-Iks4NBsFo" target="_blank">
                <span id="average-stars" class="stars">★★★★★</span>
                <span id="average-rating">Loading...</span>
            </a>
        </div>
        <div class="review-count">
            <img decoding="async" src="https://img.icons8.com/ios-filled/50/000000/rating.png" alt="Review Icon">
            <a href="https://www.google.com/maps/place/?q=place_id:ChIJe0ftVvdK3YARL-Iks4NBsFo" target="_blank">
                <span id="total-reviews">Loading...</span>
            </a>
        </div>
    </div>
    <div id="google-reviews">
        <!-- Reviews will appear here dynamically -->
    </div>

    <script>
        async function fetchBusinessDetails() {
            try {
                const response = await fetch("https://google-reviews-ccc006f827e9.herokuapp.com/api/business-details");
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Update the average rating stars
                const starsElement = document.getElementById("average-stars");
                const avgRating = data.averageRating || 0;
                const roundedRating = Math.round(avgRating); // Round to nearest whole number
                starsElement.innerText = "★".repeat(roundedRating) + "☆".repeat(5 - roundedRating);

                // Update the numeric average rating
                document.getElementById("average-rating").innerText = `(${avgRating.toFixed(1)} / 5)`;

                // Update the total reviews count with an icon
                document.getElementById("total-reviews").innerText = `${data.totalReviews || 0} Reviews`;

                // Render reviews
                const reviewsContainer = document.getElementById("google-reviews");
                reviewsContainer.innerHTML = ""; // Clear previous reviews

                if (data.reviews.length === 0) {
                    reviewsContainer.innerHTML = "<p>No 5-star reviews found.</p>";
                    return;
                }

                data.reviews.forEach(review => {
                    const reviewElement = document.createElement("div");
                    reviewElement.className = "review";
                    reviewElement.innerHTML = `
                        <div class="review-header">
                            <img src="${review.profile_photo_url}" alt="${review.author_name}'s profile picture" class="review-profile-pic">
                            <a href="${review.author_url}" target="_blank"><strong>${review.author_name}</strong></a>
                        </div>
                        <div class="review-rating">${'★'.repeat(review.rating)} (${review.rating} stars)</div>
                        <div class="review-text">${review.text}</div>
                        <div class="review-date">${review.relative_time_description}</div>
                    `;
                    reviewsContainer.appendChild(reviewElement);
                });
            } catch (error) {
                console.error("Error fetching business details:", error);
                document.getElementById("google-reviews").innerHTML = "<p>Error fetching reviews. Please try again later.</p>";
            }
        }

        // Fetch business details and reviews on page load
        document.addEventListener("DOMContentLoaded", fetchBusinessDetails);
    </script></div></div>
</div>
