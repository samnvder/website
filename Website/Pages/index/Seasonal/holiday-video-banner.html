<script>
// Simple, direct countdown using unique IDs: vb-days, vb-hours, vb-minutes, vb-seconds
var vbTargetDate = new Date("January 1, 2026 23:59:59").getTime();

setInterval(function() {
    var now = new Date().getTime();
    var diff = vbTargetDate - now;
    
    if (diff > 0) {
        var d = Math.floor(diff / (1000 * 60 * 60 * 24));
        var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var s = Math.floor((diff % (1000 * 60)) / 1000);
        
        if(document.getElementById("vb-days")) document.getElementById("vb-days").innerHTML = (d < 10 ? "0" : "") + d;
        if(document.getElementById("vb-hours")) document.getElementById("vb-hours").innerHTML = (h < 10 ? "0" : "") + h;
        if(document.getElementById("vb-minutes")) document.getElementById("vb-minutes").innerHTML = (m < 10 ? "0" : "") + m;
        if(document.getElementById("vb-seconds")) document.getElementById("vb-seconds").innerHTML = (s < 10 ? "0" : "") + s;
    }
}, 1000);

// Also run once immediately after a short delay to populate initial values
setTimeout(function() {
    var now = new Date().getTime();
    var diff = vbTargetDate - now;
    
    if (diff > 0) {
        var d = Math.floor(diff / (1000 * 60 * 60 * 24));
        var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var s = Math.floor((diff % (1000 * 60)) / 1000);
        
        if(document.getElementById("vb-days")) document.getElementById("vb-days").innerHTML = (d < 10 ? "0" : "") + d;
        if(document.getElementById("vb-hours")) document.getElementById("vb-hours").innerHTML = (h < 10 ? "0" : "") + h;
        if(document.getElementById("vb-minutes")) document.getElementById("vb-minutes").innerHTML = (m < 10 ? "0" : "") + m;
        if(document.getElementById("vb-seconds")) document.getElementById("vb-seconds").innerHTML = (s < 10 ? "0" : "") + s;
    }
}, 100);
</script>
