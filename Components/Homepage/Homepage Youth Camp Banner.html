<style>
/* Youth Summer Camp Promo - Thrive-Safe */
.youth-camp-promo,
.youth-camp-promo *,
.youth-camp-promo *::before,
.youth-camp-promo *::after {
  box-sizing: border-box !important;
}

.youth-camp-promo {
  padding: 60px 20px !important;
  background: linear-gradient(135deg, #f8f2e1 0%, #f0e9d8 100%) !important;
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  width: 100% !important;
}

.youth-camp-promo .promo-container {
  max-width: 1500px !important;
  margin: 0 auto !important;
  padding: 0 20px !important;
  width: 100% !important;
}

.youth-camp-promo .promo-card {
  display: grid !important;
  grid-template-columns: 1fr !important;
  grid-template-rows: auto auto !important;
  gap: 0 !important;
  background: rgba(255, 255, 255, 0.85) !important;
  border-radius: 24px !important;
  padding: 0 !important;
  border: 2px solid rgba(11, 70, 140, 0.12) !important;
  box-shadow: 0 12px 40px rgba(11, 70, 140, 0.1), 0 0 60px rgba(11, 70, 140, 0.04) !important;
  overflow: hidden !important;
}

/* Images - one clean row across top */
.youth-camp-promo .promo-images {
  display: grid !important;
  grid-template-columns: 1fr 1fr 1fr !important;
  gap: 10px !important;
  height: 220px !important;
  width: 100% !important;
  padding: 24px 24px 0 !important;
}

.youth-camp-promo .promo-img {
  border-radius: 14px !important;
  overflow: hidden !important;
  position: relative !important;
  box-shadow: 0 4px 15px rgba(11, 70, 140, 0.1) !important;
}

.youth-camp-promo .promo-img.featured {
  grid-row: span 1 !important;
}

.youth-camp-promo .promo-img img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  object-position: center center !important;
  display: block !important;
  max-width: none !important;
  transition: transform 0.4s ease !important;
}

.youth-camp-promo .promo-img:first-child img {
  object-position: 25% center !important;
}

.youth-camp-promo .promo-img:hover img {
  transform: scale(1.05) !important;
}

/* Title + subtitle */
.youth-camp-promo .promo-header {
  padding: 28px 24px 20px !important;
  text-align: center !important;
}

.youth-camp-promo .promo-content {
  display: flex !important;
  flex-direction: column !important;
  gap: 12px !important;
  text-align: center !important;
  align-items: center !important;
}

/* Summer block - single column */
.youth-camp-promo .promo-summer {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: flex-start !important;
  gap: 16px !important;
  padding: 0 24px 32px !important;
  text-align: center !important;

}

.youth-camp-promo .promo-half-title {

  font-size: 1.15rem !important;
  font-weight: 800 !important;
  color: #0b468c !important;
  margin: 0 !important;
}

.youth-camp-promo .promo-half-dates {

  justify-content: center !important;
  margin: 0 !important;
}

.youth-camp-promo .promo-half-buttons {

  flex-direction: column !important;
  gap: 12px !important;
  align-items: center !important;
  margin-top: auto !important;
}

.youth-camp-promo .promo-label {

  padding: 0 !important;
}

.youth-camp-promo .promo-label::after {

  width: 35px !important;
  height: 2px !important;

}

}

  padding: 0 !important;
}

.youth-camp-promo .date-pill {

}

.youth-camp-promo a.promo-cta:hover {

  color: #ffffff !important;
}

.youth-camp-promo a.promo-cta-secondary {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 10px !important;
  padding: 18px 36px !important;
  background: transparent !important;
  color: #0b468c !important;
  font-family: 'Montserrat', sans-serif !important;

  font-weight: 700 !important;
  border-radius: 50px !important;

  margin: 0 !important;
}

.youth-camp-promo a.promo-cta-secondary:hover {
  background: #0b468c !important;
  color: #f8f2e1 !important;
  transform: translateY(-2px) !important;
}

.youth-camp-promo a svg {
  flex-shrink: 0 !important;
  width: 18px !important;
  height: 18px !important;
}

@keyframes ycpCtaPulse {
  0%, 100% { box-shadow: 0 6px 25px rgba(11, 70, 140, 0.4), 0 3px 10px rgba(0, 0, 0, 0.15); }
  50% { box-shadow: 0 8px 30px rgba(11, 70, 140, 0.5), 0 4px 12px rgba(0, 0, 0, 0.18); }
}

/* TABLET */
@media (max-width: 900px) {

@media (max-width: 500px) {

    max-width: 280px !important;
    padding: 14px 24px !important;
