<!-- ARCHIVED: Original tour button using Google Calendar. Replaced by tour-button.html (nvde). -->
<!-- South End Club • See It For Yourself — inline button + modal (Google) -->
<!-- No position:fixed on the button — it sits in normal page flow -->
<!-- Uses unique "se-sify-*" IDs to avoid conflict with global "Book a Tour" -->

<!-- Button (normal flow — appears where you place this block) -->
<div style="text-align:center;padding:10px 0;">
  <div id="se-sify-btn"
    style="display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border:none;border-radius:100px;font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1;color:#ffffff;background:linear-gradient(135deg,#0b468c,#2a5a63);box-shadow:0 8px 32px rgba(11,70,140,0.35),0 4px 12px rgba(0,0,0,0.15);cursor:pointer;letter-spacing:0.3px;text-decoration:none;-webkit-tap-highlight-color:transparent;"
    onmouseover="this.style.transform='translateY(-3px) scale(1.02)';this.style.boxShadow='0 12px 40px rgba(11,70,140,0.45),0 6px 16px rgba(0,0,0,0.2)';"
    onmouseout="this.style.transform='';this.style.boxShadow='0 8px 32px rgba(11,70,140,0.35),0 4px 12px rgba(0,0,0,0.15)';"
    onclick="var m=document.getElementById('se-sify-modal');if(m){m.style.display='flex';m.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';}"
    role="button" tabindex="0"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;flex-shrink:0;"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm-2 6v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8H5z"/></svg>
    <span>See It For Yourself</span>
  </div>
</div>

<!-- Modal Overlay (position:fixed is fine here — it's hidden until clicked) -->
<div id="se-sify-modal"
  style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2147483647;align-items:center;justify-content:center;overflow:auto;"
  role="dialog" aria-modal="true" aria-hidden="true"
  onclick="if(event.target===this){this.style.display='none';this.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';}"
>
  <div style="background:#fff;border-radius:20px;width:94vw;max-width:1040px;height:90vh;max-height:780px;box-shadow:0 32px 80px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:linear-gradient(135deg,#0b468c,#204147);">
      <h3 style="margin:0;font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1;color:#fff;display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;opacity:0.9;"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm-2 6v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8H5z"/></svg>
        Book a Tour (Google)
      </h3>
      <div
        style="border:none;background:rgba(255,255,255,0.15);color:#fff;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:Montserrat,system-ui,sans-serif;font-weight:600;font-size:13px;line-height:1;display:flex;align-items:center;gap:6px;"
        onmouseover="this.style.background='rgba(255,255,255,0.25)';"
        onmouseout="this.style.background='rgba(255,255,255,0.15)';"
        onclick="var m=document.getElementById('se-sify-modal');if(m){m.style.display='none';m.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';}"
        role="button" tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Close
      </div>
    </div>
    <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Q2ClClup5YRrVRt0_5YsLJ86kzG03hpXBiPz5ZrTdODRqz6S_TI-qna9ep8acp_rpoDsuO89N?gv=true" loading="lazy" allowtransparency="true" style="flex:1;width:100%;border:none;border-bottom-left-radius:20px;border-bottom-right-radius:20px;"></iframe>
  </div>
</div>
