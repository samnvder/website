# Auto-deploy Open Play static files to Firebase Hosting when live/ or testing/ changes.
# Requires repo secret: FIREBASE_TOKEN (firebase login:ci)
name: Deploy Open Play — Firebase Hosting

on:
  push:
    branches: [main, master]
    paths:
      - 'Programs/Pickleball/live/**'
      - 'Programs/Pickleball/testing/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting (Programs/Pickleball/live)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --non-interactive
